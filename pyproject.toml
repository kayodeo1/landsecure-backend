[project]
name = "landsecure-backend"
version = "1.0.0"
description = "LandSecure — server-side property risk-assessment API (FastAPI + PostGIS-ready)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
