# Alembic configuration — production migration path.
# Dev uses create_all (see app/db.py); production runs:
#   alembic revision --autogenerate -m "init"
#   alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL is taken from app settings in migrations/env.py,
# so this is only a placeholder.
sqlalchemy.url = sqlite:///./data/landsecure.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
