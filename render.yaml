# Render Blueprint — LandSecure API
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at this repo. Render reads this file,
# provisions the free Postgres database and the web service, and wires them
# together automatically. (Or click the "Deploy to Render" button in README.)

databases:
  - name: landsecure-db
    plan: free
    databaseName: landsecure
    user: landsecure

services:
  - type: web
    name: landsecure-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Connection string from the managed Postgres above. config.py rewrites
      # the scheme to postgresql+psycopg:// so the psycopg v3 wheel is used.
      - key: DATABASE_URL
        fromDatabase:
          name: landsecure-db
          property: connectionString
      # Strong random secret generated once by Render and kept across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Allow the Vercel frontend (set the exact prod URL here after first
      # Vercel deploy if you want to lock it down). The regex below covers the
      # production domain plus every Vercel preview deployment.
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
